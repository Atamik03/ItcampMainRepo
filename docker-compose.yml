networks:
  # db/redis live only here; this network has no host route beyond what is
  # explicitly published, so db/redis can never accidentally get a host port.
  internal:
    internal: true
  # Shared meeting point between frontend-nginx (the only container with a
  # published port) and backend.
  edge: {}

volumes:
  # Frontend build output, written once by frontend-build, read-only mounted
  # into frontend-nginx.
  frontend-dist: {}
  # Redis AOF/RDB persistence. Postgres intentionally uses a host bind mount
  # instead (./data/postgres), per explicit requirement, so it is NOT listed here.
  redis-data: {}

# All secret material is generated by ./start.sh (or start.ps1) into
# ./secrets/*.txt|*.conf -- gitignored, 0600 where the OS supports it, never
# committed, never baked into an image layer. Each file's content is exactly
# the secret value (or, for redis_requirepass, a single `requirepass <value>`
# config line -- see docker/redis/redis.conf). Compose mounts each as a
# read-only tmpfs file at /run/secrets/<name> inside the consuming container,
# which is why none of these values appear in `docker inspect` (unlike a
# plain `environment:` entry sourced from `${VAR}`).
secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  redis_password:
    file: ./secrets/redis_password.txt
  redis_requirepass:
    file: ./secrets/redis_requirepass.conf
  elou_auth_secret:
    file: ./secrets/elou_auth_secret.txt
  database_url:
    file: ./secrets/database_url.txt
  redis_url:
    file: ./secrets/redis_url.txt

services:
  # ---------------------------------------------------------------------
  # db (container role: docker-bd)
  # ---------------------------------------------------------------------
  db:
    # Pinned via scripts/pin-digests.*; re-run that script to move to a newer digest.
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: unless-stopped
    init: true
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_DB: "${POSTGRES_DB}"
      # Official postgres image reads the password from a file when this is
      # set, instead of requiring POSTGRES_PASSWORD in the environment.
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - internal
    # No published ports: only reachable by other containers on `internal`.
    healthcheck:
      # pg_isready doesn't require authentication to answer, so it never
      # needs the password -- no secret-in-healthcheck concern here.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      # First boot runs initdb (creates the cluster, seeds catalogs) before
      # Postgres starts accepting connections at all; without this grace
      # window a slow first boot could exhaust `retries` and report
      # unhealthy before initdb even finishes, cascading into backend's
      # `depends_on: condition: service_healthy` failing to ever proceed.
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          # One OS process per client connection is how Postgres works (no
          # thread pool), so this needs real headroom for concurrent
          # connections + Postgres's own background workers (autovacuum,
          # wal writer, checkpointer, etc.), not just "a couple of processes".
          pids: 200
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - "no-new-privileges:true"
      - "seccomp=./docker/seccomp/hardened.json"
      - "apparmor=docker-default"
    # This service intentionally differs from the others: the official
    # postgres entrypoint always starts as root (no non-root USER in its
    # Dockerfile) and, on EVERY start (not just first init), chmod/chowns
    # the data directory and /var/run/postgresql before dropping to the
    # `postgres` user via gosu -- so these capabilities are needed on every
    # boot, not only the first. Verified empirically (see README.md
    # "Postgres capability minimization"): dropping DAC_OVERRIDE/FOWNER was
    # tried first and immediately broke startup --
    #   chmod: /var/lib/postgresql/data: Operation not permitted
    #   find: /var/lib/postgresql/data: Permission denied
    # -- because entrypoint.sh's chmod/find calls run as uid 0 but Linux
    # capabilities restrict root's own powers once specific ones are
    # stripped; FOWNER (chmod/chown metadata ops) and DAC_OVERRIDE (reading
    # directories not readable by plain permission bits) are both actually
    # exercised on every boot by this image, not just first init. All 5 of
    # the originally-listed capabilities are required; none could be safely
    # removed without breaking the official image. Everywhere else in this
    # stack uses cap_drop: [ALL] with no cap_add at all.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER

  # ---------------------------------------------------------------------
  # redis (container role: docker-redis)
  # ---------------------------------------------------------------------
  redis:
    # Pinned via scripts/pin-digests.*; re-run that script to move to a newer digest.
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    restart: unless-stopped
    init: true
    # No REDIS_PASSWORD anywhere here -- redis.conf's own `include
    # /run/secrets/redis_requirepass` line supplies `requirepass`, so the
    # secret never appears in this compose file, in `.env`, or in
    # `docker inspect`'s Command/Env for this container.
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    secrets:
      - redis_requirepass
      - redis_password
    volumes:
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-data:/data
    networks:
      - internal
    # No published ports: only reachable by other containers on `internal`.
    # uid/gid 999 is the built-in `redis` user/group baked into the official
    # redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2 image.
    user: "999:999"
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      # Reads the password fresh from the mounted secret file at healthcheck
      # EXECUTION time (container-side `$$(...)`), instead of the previous
      # `-a "$REDIS_PASSWORD"`, which was interpolated by Compose itself
      # while parsing this YAML file -- that baked the plaintext password
      # into the container's inspectable HealthConfig.Test, which is exactly
      # the kind of exposure Docker Secrets are meant to avoid. `$$` here
      # produces a literal `$` in the container's shell command, evaluated
      # only inside the container at each health check run.
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/redis_password)\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          # Slightly above maxmemory 256mb in redis.conf to leave headroom for
          # Redis's own process overhead (connections, AOF rewrite buffers, etc).
          cpus: "0.5"
          memory: 300M
          pids: 50
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - "no-new-privileges:true"
      - "seccomp=./docker/seccomp/hardened.json"
      - "apparmor=docker-default"

  # ---------------------------------------------------------------------
  # backend (container role: docker-beck)
  # ---------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Composed connection strings (host/port/db-name aren't secret, but
      # the embedded password is) live only in the secret files below --
      # DATABASE_URL_FILE / REDIS_URL_FILE are read by
      # elou_avt_twin/persistence/db.py and elou_avt_twin/realtime/redis_bus.py
      # respectively, in preference to the plain *_URL env vars. No
      # DATABASE_URL / REDIS_URL is set here, so the password never appears
      # in `docker inspect`'s Config.Env for this container.
      DATABASE_URL_FILE: /run/secrets/database_url
      REDIS_URL_FILE: /run/secrets/redis_url
      # ELOU_AUTH_SECRET_FILE is an existing mechanism in auth/store.py
      # (originally meant for auto-generating a local dev secret); pointing
      # it at the mounted Docker Secret and leaving ELOU_AUTH_SECRET unset
      # makes it read our real secret instead of generating one.
      ELOU_AUTH_SECRET_FILE: /run/secrets/elou_auth_secret
      ELOU_ENV: "${ELOU_ENV}"
      ELOU_AUTH_MODE: "${ELOU_AUTH_MODE}"
      ELOU_CORS_ORIGINS: "${ELOU_CORS_ORIGINS}"
    secrets:
      - database_url
      - redis_url
      - elou_auth_secret
    networks:
      - internal
      - edge
    # No published ports: only reachable via frontend-nginx on `edge`.
    # Matches the Dockerfile's `USER appuser` (uid/gid 10001); redundant but
    # explicit.
    user: "10001:10001"
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          # numpy/scikit-learn workloads need real headroom.
          cpus: "2.0"
          memory: 2G
          pids: 200
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - "no-new-privileges:true"
      - "seccomp=./docker/seccomp/hardened.json"
      - "apparmor=docker-default"
    # Healthcheck already defined in docker/backend/Dockerfile's HEALTHCHECK
    # instruction (with its own start_period: 15s); not redeclared here.

  # ---------------------------------------------------------------------
  # frontend-build (container role: docker-js) -- one-shot build job
  # ---------------------------------------------------------------------
  frontend-build:
    build:
      context: .
      dockerfile: docker/frontend-build/Dockerfile
    restart: "no"
    init: true
    volumes:
      - frontend-dist:/app/dist
    # No networks: pure build job with no runtime service dependencies.
    # Matches the Dockerfile's `USER node` (uid/gid 1000); redundant but
    # explicit, consistent with the other services.
    user: "1000:1000"
    cap_drop:
      - ALL
    # Safe to make the whole rootfs read-only at the COMPOSE (runtime)
    # level: by the time `docker compose up` starts this container, `npm
    # run build` has already happened at `docker build` time and /app/dist
    # is already baked into the image layer. The container's only runtime
    # action is `echo` + letting Docker auto-populate the empty
    # `frontend-dist` named volume from that pre-built layer, then exit --
    # no writes are needed at container-run time at all.
    read_only: true
    deploy:
      resources:
        limits:
          pids: 50
    security_opt:
      - "no-new-privileges:true"
      - "seccomp=./docker/seccomp/hardened.json"
      - "apparmor=docker-default"

  # ---------------------------------------------------------------------
  # frontend-nginx (container role: docker-front-nginx)
  # ---------------------------------------------------------------------
  frontend-nginx:
    build:
      context: .
      dockerfile: docker/frontend-nginx/Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      frontend-build:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
    volumes:
      - frontend-dist:/usr/share/nginx/html:ro
    ports:
      # Loopback-only: this stack has no separate reverse proxy/load
      # balancer in front of it, and the documented way to reach it
      # (README.md) is http://localhost:8080 from the same machine
      # that's running Docker Desktop. Binding 0.0.0.0 would additionally
      # expose it on every LAN/Wi-Fi interface of the host, which is
      # unneeded attack surface for a local dev/single-user stack. If you
      # deliberately want LAN access (e.g. testing from a phone on the same
      # network), change this back to "8080:8080" yourself.
      - "127.0.0.1:8080:8080"
    networks:
      - edge
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
          pids: 100
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - "no-new-privileges:true"
      - "seccomp=./docker/seccomp/hardened.json"
      - "apparmor=docker-default"
