# .gitlab-ci.yml
#
# ЭЛОУ-АВТ Digital Twin -- CI/CD pipeline.
#
# Built against the REAL current state of this repo, not a generic
# template -- see docs/gitlab-ci-setup.md for the full analysis this
# pipeline is based on (backend: Python/FastAPI, no pyproject.toml, plain
# requirements.txt; frontend: React/Vite/TS, ESLint added this session;
# Docker: 3 built images -- backend, frontend-build (one-shot), frontend-nginx
# -- plus pulled postgres/redis; deployment via docker-compose.yml +
# docker-compose.ci.yml overlay onto a persistent deploy-tagged runner).
#
# git push
#   -> validate   (YAML/compose syntax)
#   -> lint       (ESLint, TS typecheck)
#   -> security   (Bandit, Semgrep, Hadolint, Trivy filesystem) -- parallel
#   -> test       (backend pytest)                              -- parallel with security
#   -> build      (build + Trivy image scan + Docker Scout + push, PER image, gated) -- parallel across images
#   -> deploy     (docker compose pull && up -d, deploy-tagged runner, resource_group-serialized)
#   -> verify     (health checks + smoke tests, incl. the 3D-model regression check)
#
# See docs/gitlab-runner.md for what the two runner roles (`docker`-tagged
# build runner, `deploy`-tagged deployment runner) need, and why DinD is
# scoped to build only, never deploy.

# ---------------------------------------------------------------------------
# Global config
# ---------------------------------------------------------------------------

variables:
  # Immutable image identity for this pipeline run -- used for every build/
  # scan/push/deploy job below. Never "latest": see docs/gitlab-ci-setup.md
  # "Versioning" for why $CI_COMMIT_SHA (not just the short form) is used.
  IMAGE_TAG: "$CI_COMMIT_SHA"
  BACKEND_IMAGE: "$CI_REGISTRY_IMAGE/backend:$IMAGE_TAG"
  FRONTEND_BUILD_IMAGE: "$CI_REGISTRY_IMAGE/frontend-build:$IMAGE_TAG"
  FRONTEND_NGINX_IMAGE: "$CI_REGISTRY_IMAGE/frontend-nginx:$IMAGE_TAG"

  # Parameterized severity policy (task requirement) -- see "Security policy"
  # in docs/gitlab-ci-setup.md for the reasoning behind these defaults.
  # Override per-project in GitLab -> Settings -> CI/CD -> Variables if a
  # different threshold is ever needed without editing this file.
  TRIVY_SEVERITY: "HIGH,CRITICAL"
  BANDIT_SEVERITY_LEVEL: "medium"    # bandit --severity-level: report/gate at medium+
  BANDIT_CONFIDENCE_LEVEL: "medium"  # bandit --confidence-level: report/gate at medium+

  # Pinned tool versions -- see "Why pin digests/versions" below. Bump
  # deliberately, never silently.
  TRIVY_VERSION: "0.56.2"
  BANDIT_VERSION: "1.9.4"
  SEMGREP_VERSION: "1.99.0"
  HADOLINT_VERSION: "2.12.0"
  DOCKER_CLI_VERSION: "27.3.1"

  # BuildKit inline cache: each image also gets a mutable `:buildcache` tag
  # holding ONLY layer-cache metadata (not used for deployment identity --
  # deployment always uses $IMAGE_TAG, the immutable commit-SHA tag above).
  DOCKER_BUILDKIT: "1"

  GIT_DEPTH: "1"

  # docker:27-dind requires TLS between the CLI and the daemon by default;
  # this matches Docker's own documented "Docker-in-Docker with TLS"
  # pattern (see docs/gitlab-runner.md).
  DOCKER_HOST: "tcp://docker:2376"
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_TLS_VERIFY: "1"
  DOCKER_CERT_PATH: "/certs/client"

# Avoid the classic GitLab double-pipeline trap (one pipeline for the push,
# a second identical one for the MR) -- run on MRs, on the default branch,
# and on tags; a plain branch push that ALSO has an open MR is suppressed
# in favour of the MR pipeline. See docs/gitlab-ci-setup.md "Pipeline
# triggers" for the full truth table this implements.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "web"

stages:
  - validate
  - lint
  - security
  - test
  - build
  - deploy
  - verify
  - rollback

# ---------------------------------------------------------------------------
# Reusable fragments
# ---------------------------------------------------------------------------

.dind_build: &dind_build
  image: docker:$DOCKER_CLI_VERSION
  services:
    - docker:$DOCKER_CLI_VERSION-dind
  tags: [docker]
  before_script:
    - docker info
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" "$CI_REGISTRY" --password-stdin

.node_cache: &node_cache
  cache:
    key:
      files: [elou_avt_web/package-lock.json]
    paths:
      - elou_avt_web/.npm/

.pip_cache: &pip_cache
  cache:
    key:
      files: [elou_avt_twin/requirements.txt]
    paths:
      - .pip-cache/

# ---------------------------------------------------------------------------
# validate
# ---------------------------------------------------------------------------

yaml-and-compose-validate:
  stage: validate
  image: docker:$DOCKER_CLI_VERSION
  tags: [docker]
  before_script:
    - apk add --no-cache docker-cli-compose curl >/dev/null
  script:
    # .gitlab-ci.yml itself, via GitLab's own CI Lint API -- catches schema
    # errors (bad rules:/needs:/artifacts: shape) that a plain YAML parser
    # would miss because they're valid YAML but invalid GitLab CI syntax.
    - |
      LINT_RESULT=$(curl -s --header "PRIVATE-TOKEN: $CI_JOB_TOKEN" \
        --data-urlencode "content@.gitlab-ci.yml" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/ci/lint")
      echo "$LINT_RESULT" | grep -q '"valid":true' && echo "gitlab-ci.yml: VALID" || { echo "$LINT_RESULT"; echo "gitlab-ci.yml: INVALID"; exit 1; }
    # docker-compose.yml + the CI deploy overlay, both merged the exact way
    # the deploy job will merge them -- catches the class of bug this
    # pipeline's own authoring session hit once already (a `ports:` merge
    # silently appending instead of replacing across the two files).
    - |
      POSTGRES_USER=x POSTGRES_DB=x ELOU_ENV=x ELOU_AUTH_MODE=x ELOU_CORS_ORIGINS=x \
      BACKEND_IMAGE=x FRONTEND_BUILD_IMAGE=x FRONTEND_NGINX_IMAGE=x \
      docker compose -f docker-compose.yml -f docker-compose.ci.yml config -q
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "push"

# ---------------------------------------------------------------------------
# lint
# ---------------------------------------------------------------------------

frontend-typecheck:
  stage: lint
  image: node:20-alpine
  tags: [docker]
  <<: *node_cache
  script:
    - cd elou_avt_web
    - npm ci --cache .npm --prefer-offline
    - npx tsc -b --noEmit

frontend-eslint:
  stage: lint
  image: node:20-alpine
  tags: [docker]
  <<: *node_cache
  script:
    - cd elou_avt_web
    - npm ci --cache .npm --prefer-offline
    - npm run lint
  # This project's existing ESLint config (elou_avt_web/eslint.config.js,
  # added this session -- there was none before) reports style/DX warnings
  # (react-refresh/only-export-components etc.) as non-blocking; only
  # actual `error`-level findings fail the job (`eslint .`'s own exit code
  # is already 0 with 0 errors / N warnings, so no extra flag is needed --
  # see docs/gitlab-ci-setup.md "Security policy" for the reviewed baseline:
  # 85 pre-existing warnings, 0 errors, confirmed locally before this
  # pipeline was written).

# ---------------------------------------------------------------------------
# security (parallel with each other AND with `test`)
# ---------------------------------------------------------------------------

bandit:
  stage: security
  image: python:3.12-slim
  tags: [docker]
  script:
    - pip install --no-cache-dir "bandit==$BANDIT_VERSION"
    # Full-severity JSON report as an artifact for visibility (never fails
    # the job by itself -- --exit-zero), THEN a second invocation at the
    # actual gate threshold whose own exit code decides pass/fail. Bandit
    # exits non-zero if it finds ANY issue at or above --severity-level /
    # --confidence-level, so no extra `if` logic is needed here.
    - bandit -r elou_avt_twin -x elou_avt_twin/.venv,elou_avt_twin/tests -f json -o bandit-report.json --exit-zero
    - bandit -r elou_avt_twin -x elou_avt_twin/.venv,elou_avt_twin/tests -f screen
    - bandit -r elou_avt_twin -x elou_avt_twin/.venv,elou_avt_twin/tests --severity-level "$BANDIT_SEVERITY_LEVEL" --confidence-level "$BANDIT_CONFIDENCE_LEVEL"
  artifacts:
    when: always
    paths: [bandit-report.json]
    expire_in: 30 days
  # No native GitLab SAST report schema for Bandit (unlike Semgrep below) --
  # documented limitation, see docs/gitlab-ci-setup.md "Reports and
  # artifacts". Findings are fully visible in the job log (file:line, rule
  # ID, severity, confidence, description) and in the JSON artifact.

semgrep:
  stage: security
  image: returntocorp/semgrep:$SEMGREP_VERSION
  tags: [docker]
  variables:
    SEMGREP_METRICS: "off"
  script:
    # Only the language rulesets this repo actually contains code for
    # (Python backend, TypeScript/React frontend) plus two
    # language-agnostic security packs -- deliberately NOT pulling in
    # rulesets for languages this project doesn't use.
    - semgrep scan
        --config=p/python --config=p/typescript --config=p/react
        --config=p/security-audit --config=p/secrets
        --exclude="**/.venv/**" --exclude="**/node_modules/**"
        --exclude="**/dist/**" --exclude="**/visual/**"
        --metrics=off
        --gitlab-sast-output=gl-sast-report.json
        --gitlab-secrets-output=gl-secret-detection-report.json
        --error
        .
  artifacts:
    when: always
    reports:
      sast: gl-sast-report.json
      secret_detection: gl-secret-detection-report.json
    expire_in: 30 days

hadolint:
  stage: security
  image: hadolint/hadolint:$HADOLINT_VERSION-alpine
  tags: [docker]
  script:
    # All three Dockerfiles in this repo, not just one -- .hadolint.yaml
    # (root, shared) documents the one reviewed exception (DL3008 on the
    # backend builder stage, see that file's comments for why).
    - |
      status=0
      for f in docker/backend/Dockerfile docker/frontend-build/Dockerfile docker/frontend-nginx/Dockerfile; do
        echo "== $f =="
        hadolint --config .hadolint.yaml "$f" || status=1
      done
      exit $status

trivy-fs:
  stage: security
  image: aquasec/trivy:$TRIVY_VERSION
  tags: [docker]
  variables:
    TRIVY_CACHE_DIR: .trivy-cache
  cache:
    key: trivy-db
    paths: [.trivy-cache/]
  script:
    # `gitlab.tpl` produces GitLab's container_scanning/dependency_scanning
    # report family for either an image or filesystem target -- verified
    # locally to emit a valid dependency_scanning-shaped report (schema
    # version 15.0.7) when pointed at `fs` scans, same as the image-scan
    # jobs below use it for `image` scans.
    - trivy fs --scanners vuln,secret,misconfig --severity "$TRIVY_SEVERITY"
        --skip-dirs elou_avt_twin/.venv,elou_avt_web/node_modules,visual,data,secrets
        --ignorefile .trivyignore
        --format template --template "@/contrib/gitlab.tpl" --output gl-dependency-scanning-report.json .
    - trivy fs --scanners vuln,secret,misconfig --severity "$TRIVY_SEVERITY"
        --skip-dirs elou_avt_twin/.venv,elou_avt_web/node_modules,visual,data,secrets
        --ignorefile .trivyignore
        --exit-code 1 .
  artifacts:
    when: always
    reports:
      dependency_scanning: gl-dependency-scanning-report.json
    expire_in: 30 days

# ---------------------------------------------------------------------------
# test (parallel with security)
# ---------------------------------------------------------------------------

backend-tests:
  stage: test
  image: python:3.12-slim
  tags: [docker]
  <<: *pip_cache
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  script:
    - cd elou_avt_twin
    - pip install --no-cache-dir -r requirements.txt
    # No DATABASE_URL / REDIS_URL set here: persistence/db.py and
    # realtime/redis_bus.py both fall back to local SQLite / a
    # try/except-guarded no-op Redis client when unset (see
    # elou_avt_twin/persistence/db.py's resolve_url() and
    # elou_avt_twin/realtime/redis_bus.py's own docstring) -- exactly the
    # same fallback this repo's own local non-Docker dev path relies on,
    # so the test suite needs no Postgres/Redis services in this job.
    - python -m pytest -q
  # No frontend test job exists on purpose: elou_avt_web has no test
  # framework installed (no vitest/jest, no *.test.*/*.spec.* files) --
  # confirmed by inspection, not assumed. Documented as a real gap in
  # docs/gitlab-ci-setup.md rather than inventing a test command that
  # doesn't exist in this project.

# ---------------------------------------------------------------------------
# build (needs: everything above green; 3 independent images in parallel)
# ---------------------------------------------------------------------------
#
# Each job below does build -> Trivy image scan -> Docker Scout -> push, IN
# THAT ORDER, inside ONE job. This is deliberate, not a shortcut: the image
# is pushed to the registry as the LAST step, only reached if both scans
# already exited 0 -- so a vulnerable image is never pushed at all, rather
# than being pushed and scanned-after-the-fact. See CI constraint #7 in
# docs/gitlab-ci-setup.md.

.build_scan_push:
  <<: *dind_build
  stage: build
  needs:
    - frontend-typecheck
    - frontend-eslint
    - bandit
    - semgrep
    - hadolint
    - trivy-fs
    - backend-tests
  script:
    - docker build -t "$IMAGE" -f "$DOCKERFILE" .
    # Image scan #1: Trivy. Same severity policy and .trivyignore as the
    # filesystem scan above -- see docs/gitlab-ci-setup.md "Security
    # policy" for why the remaining entries in .trivyignore have no fix
    # published anywhere yet (verified per-CVE, not blanket-suppressed).
    - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$CI_PROJECT_DIR/.trivyignore:/.trivyignore"
        "aquasec/trivy:$TRIVY_VERSION" image --severity "$TRIVY_SEVERITY" --ignorefile /.trivyignore
        --format template --template "@/contrib/gitlab.tpl" --output "gl-container-scanning-$SERVICE.json" "$IMAGE"
    - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$CI_PROJECT_DIR/.trivyignore:/.trivyignore"
        "aquasec/trivy:$TRIVY_VERSION" image --severity "$TRIVY_SEVERITY" --ignorefile /.trivyignore --exit-code 1 "$IMAGE"
    # Image scan #2: Docker Scout. Requires DOCKERHUB_USER/DOCKERHUB_TOKEN
    # (see docs/gitlab-ci-setup.md) -- Scout's analysis is a Docker
    # Hub-linked cloud service, independent of the GitLab registry
    # credentials already used to push. `--exit-code` mirrors Trivy's own
    # gate: fail the job (and therefore never reach `docker push` below)
    # on any HIGH/CRITICAL finding.
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USER" --password-stdin
    - docker scout cves --exit-code --only-severity critical,high "$IMAGE"
    - docker push "$IMAGE"
  artifacts:
    when: always
    reports:
      container_scanning: gl-container-scanning-$SERVICE.json
    expire_in: 30 days

build-backend:
  extends: .build_scan_push
  variables:
    SERVICE: backend
    IMAGE: "$BACKEND_IMAGE"
    DOCKERFILE: docker/backend/Dockerfile

build-frontend-build:
  extends: .build_scan_push
  variables:
    SERVICE: frontend-build
    IMAGE: "$FRONTEND_BUILD_IMAGE"
    DOCKERFILE: docker/frontend-build/Dockerfile

build-frontend-nginx:
  extends: .build_scan_push
  variables:
    SERVICE: frontend-nginx
    IMAGE: "$FRONTEND_NGINX_IMAGE"
    DOCKERFILE: docker/frontend-nginx/Dockerfile

# ---------------------------------------------------------------------------
# deploy
# ---------------------------------------------------------------------------
#
# Runs directly ON the deploy runner's own host (shell executor, tagged
# `deploy`) -- NOT inside a docker/DinD job. The runner IS the deployment
# target: it already has Docker Engine + Compose v2 installed on its host
# (see docs/gitlab-runner.md), so this job just shells out to the SAME
# `docker compose` the local dev workflow (start.sh/start.ps1) uses,
# pointed at the CI overlay instead of `build:`.
#
# Only ever runs automatically on the default branch (README.md's own
# documented workflow has exactly one deployment target -- there is no
# per-branch dynamic-environment infrastructure in this repo to deploy
# feature branches into safely; see docs/gitlab-ci-setup.md "Branching
# strategy" for why this deliberately differs from a literal read of the
# brief's example diagram). Available `when: manual` from any branch/MR
# pipeline for a developer who explicitly wants to push their own build to
# the shared environment to test it.
deploy:
  stage: deploy
  tags: [deploy]
  environment:
    name: development
    url: http://$DEPLOY_HOST:8080
  # Serializes concurrent deploys: if developers A, B, C all push around
  # the same time, their deploy jobs queue and run one at a time instead of
  # racing `docker compose down/pull/up` against each other on the same
  # host (task requirement: "конкурирующие deployment").
  resource_group: development
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
    - when: manual
  script:
    - mkdir -p "$DEPLOY_PATH"
    - cp docker-compose.yml docker-compose.ci.yml "$DEPLOY_PATH/"
    - cp docker/redis/redis.conf "$DEPLOY_PATH/redis.conf.tmp" 2>/dev/null || true
    - cd "$DEPLOY_PATH"
    # Non-secret config: same shape as .env.example, values from CI/CD
    # variables (see docs/gitlab-ci-setup.md).
    - |
      cat > .env <<EOF
      POSTGRES_USER=${POSTGRES_USER}
      POSTGRES_DB=${POSTGRES_DB}
      ELOU_ENV=production
      ELOU_AUTH_MODE=enabled
      ELOU_CORS_ORIGINS=${ELOU_CORS_ORIGINS}
      EOF
    # Secrets: written from GitLab CI/CD Variables (masked+protected) on
    # EVERY deploy, not generated once like start.sh's local-dev flow --
    # this is the deliberate difference documented in
    # docs/gitlab-ci-setup.md "Secrets on the deploy runner": a
    # randomly-generated-per-deploy password would desync from the
    # already-initialized Postgres cluster in ./data/postgres, exactly the
    # trap start.sh's own header comment warns about. Values come from
    # GitLab, not generated here, so they're stable across deploys AND
    # never hardcoded in this file.
    - mkdir -p secrets
    - printf '%s' "$DEPLOY_POSTGRES_PASSWORD" > secrets/postgres_password.txt
    - printf '%s' "$DEPLOY_REDIS_PASSWORD" > secrets/redis_password.txt
    - printf 'requirepass %s\n' "$DEPLOY_REDIS_PASSWORD" > secrets/redis_requirepass.conf
    - printf '%s' "$DEPLOY_ELOU_AUTH_SECRET" > secrets/elou_auth_secret.txt
    - printf 'postgresql://%s:%s@db:5432/%s' "$POSTGRES_USER" "$DEPLOY_POSTGRES_PASSWORD" "$POSTGRES_DB" > secrets/database_url.txt
    - printf 'redis://:%s@redis:6379/0' "$DEPLOY_REDIS_PASSWORD" > secrets/redis_url.txt
    - chmod 600 secrets/*.txt secrets/*.conf 2>/dev/null || true
    - mkdir -p data/postgres docker/redis
    - mv redis.conf.tmp docker/redis/redis.conf 2>/dev/null || true
    # Rollback support (see the `rollback` job below): remember what was
    # actually running and healthy BEFORE this deploy overwrites it, so a
    # human-triggered rollback has exactly one known-good SHA to return to.
    # Deliberately simple -- one-step "last known good", not a full
    # history -- because that's what this single-host, no-orchestrator
    # deployment target can support safely (see docs/gitlab-ci-setup.md
    # "Rollback" for why a deeper mechanism isn't implemented here).
    - |
      if [ -f .last_healthy_sha ]; then
        cp .last_healthy_sha .previous_healthy_sha
      fi
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" "$CI_REGISTRY" --password-stdin
    - >
      BACKEND_IMAGE="$BACKEND_IMAGE" FRONTEND_BUILD_IMAGE="$FRONTEND_BUILD_IMAGE" FRONTEND_NGINX_IMAGE="$FRONTEND_NGINX_IMAGE"
      docker compose -f docker-compose.yml -f docker-compose.ci.yml pull
    - >
      BACKEND_IMAGE="$BACKEND_IMAGE" FRONTEND_BUILD_IMAGE="$FRONTEND_BUILD_IMAGE" FRONTEND_NGINX_IMAGE="$FRONTEND_NGINX_IMAGE"
      docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d

# ---------------------------------------------------------------------------
# verify (health checks + smoke tests, incl. the 3D-model regression check)
# ---------------------------------------------------------------------------

verify:
  stage: verify
  tags: [deploy]
  environment:
    name: development
    url: http://$DEPLOY_HOST:8080
  needs: [deploy]
  script:
    - cd "$DEPLOY_PATH"
    - |
      echo "== waiting for container healthchecks =="
      for svc in db redis backend frontend-nginx; do
        for i in $(seq 1 60); do
          status=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' "$(docker compose -f docker-compose.yml -f docker-compose.ci.yml ps -q "$svc")" 2>/dev/null || echo "starting")
          [ "$status" = "healthy" ] || [ "$status" = "no-healthcheck" ] && { echo "$svc: $status"; break; }
          [ "$status" = "unhealthy" ] && { echo "$svc: UNHEALTHY"; docker compose -f docker-compose.yml -f docker-compose.ci.yml logs "$svc"; exit 1; }
          sleep 3
        done
      done
    - |
      echo "== core API smoke tests =="
      set -e
      code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080/health"); [ "$code" = "200" ] || { echo "GET /health -> $code"; exit 1; }
      code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080/"); [ "$code" = "200" ] || { echo "GET / -> $code"; exit 1; }
      code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080/docs"); [ "$code" = "200" ] || { echo "GET /docs -> $code"; exit 1; }
      code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080/openapi.json"); [ "$code" = "200" ] || { echo "GET /openapi.json -> $code"; exit 1; }
      TOKEN=$(curl -s -X POST "http://127.0.0.1:8080/auth/login" -H "Content-Type: application/json" -d '{"username":"admin","password":"admin"}' | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")
      [ -n "$TOKEN" ] || { echo "POST /auth/login: no token returned"; exit 1; }
      code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "http://127.0.0.1:8080/auth/roles"); [ "$code" = "200" ] || { echo "GET /auth/roles -> $code"; exit 1; }
      echo "core API: OK"
    - |
      echo "== 3D model regression check (Кабинет полевого оператора) =="
      # Targeted at the exact multi-layer bug fixed earlier this session
      # (see README.md "Три причины, по которым не грузилась 3D-модель"):
      # X-Frame-Options/CSP blocking the app's own iframe, and CSP blocking
      # the page's inline scripts entirely. No browser/E2E test framework
      # exists in this repo (confirmed: no vitest/jest/playwright/cypress)
      # -- this is the minimal automated check possible without one,
      # exercising every layer that broke: HTTP status, MIME type, static
      # asset availability, nginx routing, and the specific response
      # headers a real browser enforces.
      set -e
      RESP=$(curl -sD- -o /tmp/model.html "http://127.0.0.1:8080/avt4_3d_model_v7.html?theme=dark")
      code=$(echo "$RESP" | head -1 | grep -o '[0-9][0-9][0-9]'); [ "$code" = "200" ] || { echo "GET /avt4_3d_model_v7.html -> $code"; exit 1; }
      echo "$RESP" | grep -qi "^content-type: text/html" || { echo "unexpected Content-Type"; echo "$RESP"; exit 1; }
      echo "$RESP" | grep -qi "^x-frame-options: SAMEORIGIN" || { echo "X-Frame-Options is not SAMEORIGIN -- iframe would be blocked by the browser (see README.md)"; echo "$RESP"; exit 1; }
      echo "$RESP" | grep -qi "script-src 'self' 'unsafe-inline'" || { echo "CSP script-src missing 'unsafe-inline' -- inline Three.js code would be blocked"; echo "$RESP"; exit 1; }
      echo "$RESP" | grep -qi "frame-ancestors 'self'" || { echo "CSP frame-ancestors is not 'self'"; echo "$RESP"; exit 1; }
      grep -q "avt4_3d_model_v7.html\|THREE" /tmp/model.html || { echo "model page body looks empty/wrong"; exit 1; }
      code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080/three/three.min.js"); [ "$code" = "200" ] || { echo "GET /three/three.min.js -> $code"; exit 1; }
      ctype=$(curl -sI "http://127.0.0.1:8080/three/three.min.js" | grep -i "^content-type" | tr -d '\r')
      echo "$ctype" | grep -qi "javascript" || { echo "three.min.js unexpected Content-Type: $ctype"; exit 1; }
      # Main app page must NOT carry the relaxed policy (regression guard
      # against accidentally widening it repo-wide instead of scoping it).
      MAIN=$(curl -sD- -o /dev/null "http://127.0.0.1:8080/")
      echo "$MAIN" | grep -qi "^x-frame-options: DENY" || { echo "main page X-Frame-Options weakened -- should stay DENY"; echo "$MAIN"; exit 1; }
      echo "3D model check: OK"
    # On success, this SHA becomes the new "last known good" for rollback.
    - echo "$IMAGE_TAG" > "$DEPLOY_PATH/.last_healthy_sha"
  after_script:
    - |
      if [ "$CI_JOB_STATUS" != "success" ]; then
        echo "verify failed -- see docs/gitlab-ci-setup.md 'Rollback' and trigger the manual rollback job if this left the environment broken."
      fi

# ---------------------------------------------------------------------------
# rollback (manual only -- see docs/gitlab-ci-setup.md "Rollback" for the
# documented limitation: single-step "last known good", not a history)
# ---------------------------------------------------------------------------

rollback:
  stage: rollback
  tags: [deploy]
  environment:
    name: development
    url: http://$DEPLOY_HOST:8080
  resource_group: development
  # ALWAYS manual, on any branch -- a rollback must never auto-trigger just
  # because a pipeline on the default branch happened to succeed. (An
  # earlier draft of this job had `rules: [{if: default branch}, {when:
  # manual}]` with no explicit `when:` on the first rule, which defaults to
  # `on_success` and would have scheduled an automatic rollback after
  # EVERY successful default-branch deploy -- caught and fixed before this
  # pipeline was ever run for real.)
  rules:
    - when: manual
  script:
    - cd "$DEPLOY_PATH"
    - test -f .previous_healthy_sha || { echo "No previous known-good SHA recorded -- nothing to roll back to. This is expected on the very first deploy; see docs/gitlab-ci-setup.md 'Rollback' for the documented limitation of this single-step mechanism."; exit 1; }
    - ROLLBACK_SHA=$(cat .previous_healthy_sha)
    - echo "Rolling back to $ROLLBACK_SHA"
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" "$CI_REGISTRY" --password-stdin
    - >
      BACKEND_IMAGE="$CI_REGISTRY_IMAGE/backend:$ROLLBACK_SHA"
      FRONTEND_BUILD_IMAGE="$CI_REGISTRY_IMAGE/frontend-build:$ROLLBACK_SHA"
      FRONTEND_NGINX_IMAGE="$CI_REGISTRY_IMAGE/frontend-nginx:$ROLLBACK_SHA"
      docker compose -f docker-compose.yml -f docker-compose.ci.yml pull
    - >
      BACKEND_IMAGE="$CI_REGISTRY_IMAGE/backend:$ROLLBACK_SHA"
      FRONTEND_BUILD_IMAGE="$CI_REGISTRY_IMAGE/frontend-build:$ROLLBACK_SHA"
      FRONTEND_NGINX_IMAGE="$CI_REGISTRY_IMAGE/frontend-nginx:$ROLLBACK_SHA"
      docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d
    - sleep 15
    - code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080/health"); [ "$code" = "200" ] || { echo "rollback health check failed: $code"; exit 1; }
    - echo "$ROLLBACK_SHA" > .last_healthy_sha
    - echo "Rolled back to $ROLLBACK_SHA successfully."
