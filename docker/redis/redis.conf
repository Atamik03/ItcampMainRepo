# redis.conf for the redis (docker-redis) service.
#
# NOTE on auth: redis.conf does NOT support ${VAR}-style environment variable
# substitution natively, so `requirepass` is deliberately OMITTED from this
# static file. Instead, docker-compose.yml mounts a Docker Secret file at
# /run/secrets/redis_requirepass whose entire content is a single line:
#   requirepass <the actual password>
# and this file's last line `include` pulls it in at redis-server startup.
# That keeps the password out of `docker inspect` (Config.Env / Command),
# out of `docker-compose.yml`/`.env`, and out of this static config file --
# it lives only in ./secrets/redis_requirepass.conf (gitignored, 0600) and
# the container's /run/secrets mount (tmpfs, not persisted to any image
# layer or writable volume).

# ---- Memory / eviction ----
maxmemory 256mb
maxmemory-policy allkeys-lru

# ---- Persistence ----
# AOF gives the cache a chance to survive a restart. Note: pub/sub messages
# (e.g. chat channels) are inherently transient and are NOT persisted by AOF --
# only key/value data is. Kept on anyway since auth-cache/session keys benefit
# from surviving a restart; this is a minor optimization, not a correctness
# requirement.
appendonly yes

# ---- Disable dangerous admin commands ----
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""

# ---- Auth secret (Docker Secret, see note at top of this file) ----
include /run/secrets/redis_requirepass
