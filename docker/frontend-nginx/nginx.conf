# nginx.conf for the frontend-nginx (docker-front-nginx) service.
# Base image nginxinc/nginx-unprivileged:1.27-alpine already listens on 8080 by
# convention and reads /etc/nginx/conf.d/default.conf -- this file replaces that
# default server block.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Don't leak nginx version in error pages / Server header.
    server_tokens off;

    client_max_body_size 10m;

    # ---- Security headers (applied to all responses) ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # CSP is the primary XSS mitigation here: script-src is locked to 'self' with
    # no 'unsafe-inline'/'unsafe-eval', so injected <script> tags/inline handlers
    # cannot execute even if an XSS payload gets into the DOM.
    # style-src keeps 'unsafe-inline' because Vite/React commonly inject <style>
    # tags or use inline style attributes at runtime; omitting it would likely
    # break the app's CSS. If you want to remove it for stricter hardening, do so
    # deliberately and test the whole SPA (styled-components/CSS-in-JS output,
    # any inline `style=` usage) before shipping.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: wss:; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;

    # ---- SPA client-side routing ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- Field-operator 3D model viewer ----
    # FieldOperatorScreen.tsx embeds this static page in a same-origin <iframe>
    # (elou_avt_web/src/pages/admin/FieldOperatorScreen.tsx) and waits for it to
    # postMessage "elou-model-ready"/"elou-model-error". Two blanket security
    # headers above broke it, discovered one after the other by actually
    # testing in a browser (curl alone shows 200 for both and misses this
    # entirely -- these are browser-enforced, not server-side, failures):
    #   1. `X-Frame-Options: DENY` / CSP `frame-ancestors 'none'` blocked the
    #      app's OWN same-origin iframe from rendering at all.
    #   2. Once that was fixed, `script-src 'self'` (no 'unsafe-inline')
    #      still blocked EVERY <script> on this page, since it's a single
    #      self-contained static HTML file (elou_avt_web/public/avt4_3d_model_v7.html,
    #      ~1700 lines of inline Three.js, plus inline onload=/onerror=
    #      attributes on the <script src="three/three.min.js"> tag) -- none
    #      of it is external .js files, so a strict script-src blocks the
    #      whole page's logic from ever running, including the very handlers
    #      that would have reported an error. DevTools confirmed:
    #      "Executing inline script violates ... script-src 'self'".
    # Both relaxations are scoped to ONLY this one location, not the rest of
    # the site: this is a static, developer-authored, build-time asset (not
    # user-generated content), so the inline-script XSS threat model that
    # `script-src 'self'` defends against elsewhere doesn't apply here the
    # same way. Rewriting ~1700 lines of inline JS into an external file
    # would remove the need for this override, but is a much larger, riskier
    # change for an equivalent security outcome on a page with no user input.
    # `add_header` does not inherit into a location block that sets its own,
    # so every header is re-declared here.
    location = /avt4_3d_model_v7.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: wss:; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self';" always;
        try_files $uri =404;
    }

    # ---- WebSocket endpoints (must come before the generic REST proxy block) ----
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ---- REST API reverse proxy to the backend ----
    # Grouped with a regex alternation instead of one location block per path.
    # `openapi.json` is what the Swagger UI at `/docs` fetches client-side to
    # render itself -- without it in this list, `/docs` loads but shows a
    # blank/broken page in a real browser (found while verifying this stack
    # end-to-end; not caught by curl-only checks against `/docs` itself,
    # which returns 200 regardless).
    location ~ ^/(state|history|scheme|equipment|action|input|scenario|failure|alarms|simulation|command|controllers|training|lms|auth|health|docs|openapi\.json) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
